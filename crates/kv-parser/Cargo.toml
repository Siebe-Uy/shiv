[package]
name = "kv-parser"
version = "0.1.0"
edition = "2024"
description = "Native KeyValues (VDF) parser library with AST support"
license = "GPL-3.0"

[lib]
name = "kv_parser"
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
