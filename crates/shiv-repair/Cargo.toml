[package]
name = "shiv-repair"
version = "0.1.0"
edition = "2024"
description = "Mod health checks and the repair engine, ported from Deadlock Mod Manager"
license = "GPL-3.0"

[lib]
name = "shiv_repair"
path = "src/lib.rs"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
keyvalues-parser = "0.2"
vpk-parser = { path = "../vpk-parser" }
vpkmanager = { path = "../vpkmanager" }
source2-model = { path = "../source2-model" }

[dev-dependencies]
hex = "0.4"
