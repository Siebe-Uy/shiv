[package]
name = "shiv-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[lib]
name = "shiv_core"
path = "src/lib.rs"

[dependencies]
steamlocate = "2.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-case"] }
thiserror = "2"
kv-parser = { path = "../kv-parser" }
vpk-parser = { path = "../vpk-parser" }
zip = "6.0.0"
unrar = "0.5.8"
sevenz-rust2 = "0.21.4"

[dev-dependencies]
tempfile = "3"
crc32fast = "1"
