[package]
name = "shiv-ui"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[[bin]]
name = "shiv_ui"
path = "src/main.rs"

[features]
# Developer probe for screenshots and memory measurements in release builds
# (see `browse::dev_probe`). Never part of a normal build.
dev-probe = []

[dependencies]
shiv-api = { path = "../shiv-api" }
shiv-core = { path = "../shiv-core" }
shiv-repair = { path = "../shiv-repair" }
# Software renderer only (docs/toolkit.md): no GPU stack is linked, so the
# winit backend picks it without SLINT_BACKEND.
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "backend-winit-wayland",
    "renderer-software",
] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
tempfile = "3.27.0"

# malloc_trim and mallopt: hand freed memory (Performance, Repair, thumbnails) back to the OS.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2.191"

[build-dependencies]
slint-build = "1.18.1"

[dev-dependencies]
# Headless Slint platform for driving the UI in tests (same version as slint).
i-slint-backend-testing = { version = "=1.18.1", default-features = false }
tiny_http = "0.12.0"
# Builds repair fixtures (compiled game data packed into VPKs) in tests.
vpkmanager = { path = "../vpkmanager" }
