[package]
name = "vpk-parser"
version = "0.1.0"
edition = "2024"
description = "Native VPK parser library"
license = "GPL-3.0"

[lib]
name = "vpk_parser"
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
twox-hash = "2.1.2"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
