[package]
name = "spike"
version = "0.0.0"
edition = "2024"

[workspace]

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "backend-winit-wayland", "renderer-femtovg", "renderer-software", "renderer-skia"] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
